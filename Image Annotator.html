    const x = Math.min(start.x, end.x);
    const y = Math.min(start.y, end.y);
    const width = Math.abs(start.x - end.x);
    const height = Math.abs(start.y - end.y);
    return { x, y, width, height };
  }

  /* Selection */

  function findAnnotationHandle(point) {
    const threshold = 10 / appState.viewport.zoom;
    for (let i = appState.annotations.length - 1; i >= 0; i--) {
      const annotation = appState.annotations[i];
      if (!isAnnotationVisible(annotation.id)) continue;
      if (isAnnotationLocked(annotation.id)) continue;
      const handles = getAnnotationHandles(annotation);
      for (const handle of handles) {
        const dist = Math.hypot(point.x - handle.x, point.y - handle.y);
        if (dist <= threshold) {
          return { annotation, handle };
        }
      }
    }
    return null;
  }

  function handleSelectDown(event) {
    activeHandle = null;
    const point = toCanvasCoords(event.clientX, event.clientY);
    const handleHit = findAnnotationHandle(point);
    if (handleHit) {
      activeHandle = {
        annotation: handleHit.annotation,
        index: handleHit.handle.index,
        kind: handleHit.handle.kind,
        key: handleHit.handle.key,
        anchor: handleHit.handle.anchor ? { ...handleHit.handle.anchor } : null
      };
      if (!appState.selection.includes(handleHit.annotation.id)) {
        appState.selection = [handleHit.annotation.id];
      }
      appState.dragStart = point;
      appState.lastPointer = point;
      updateHandleMeasurement(handleHit.annotation);
      refreshUI();
      scheduleRedraw();
      return;
    }

    const hit = hitTest(point);
    if (hit) {
      if (!isShiftPressed(event)) {
        appState.selection = [hit.id];
      } else if (!appState.selection.includes(hit.id)) {
        appState.selection.push(hit.id);
      }
      appState.dragStart = point;
      appState.lastPointer = appState.dragStart;
    } else {
      appState.selection = [];
    }
    refreshUI();
    scheduleRedraw();
  }

  function handleSelectMove(event, point) {
    if (!appState.selection.length || !event.buttons) return;
    if (activeHandle) {
      const annotation = activeHandle.annotation;
      if (!annotation || isAnnotationLocked(annotation.id)) return;
      if (!applyHandleDrag(annotation, activeHandle, point, event)) return;
      updateHandleMeasurement(annotation);
      appState.lastPointer = point;
      scheduleRedraw();
      return;
    }
    const dx = point.x - appState.lastPointer.x;
    const dy = point.y - appState.lastPointer.y;
    if (!dx && !dy) return;
    for (const id of appState.selection) {
      const annotation = appState.annotations.find(a => a.id === id);
      if (annotation && !isAnnotationLocked(annotation.id)) {
        translateAnnotation(annotation, dx, dy);
      }
    }
    appState.lastPointer = point;
    scheduleRedraw();
  }

  function inferOppositeCorner(rect, index) {
    if (!rect) return null;
    const { x, y, width, height } = rect;
    const x2 = x + width;
    const y2 = y + height;
    const anchors = [
      { x: x2, y: y2 },
      { x, y: y2 },
      { x, y },
      { x: x2, y }
    ];
    return anchors[index] ? { ...anchors[index] } : null;
  }

  function applyHandleDrag(annotation, handle, point, event) {
    switch (annotation.type) {
      case 'point': {
        const snapped = maybeSnapPoint(point);
        annotation.geometry.x = snapped.x;
        annotation.geometry.y = snapped.y;
        return true;
      }
      case 'line': {
        const other = handle.index === 0 ? annotation.geometry.end : annotation.geometry.start;
        const target = other && isShiftPressed(event) ? constrainPointToAngle(other, point) : point;
        const snapped = maybeSnapPoint(target);
        if (handle.index === 0) {
          annotation.geometry.start = { ...snapped };
        } else {
          annotation.geometry.end = { ...snapped };
        }
        return true;
      }
      case 'polyline':
      case 'polygon':
      case 'triangle': {
        const points = annotation.geometry.points;
        if (!points || !points[handle.index]) return false;
        const snapped = maybeSnapPoint(point);
        points[handle.index] = { x: snapped.x, y: snapped.y };
        return true;
      }
      case 'rect':
      case 'ellipse': {
        const anchor = handle.anchor || inferOppositeCorner(annotation.geometry, handle.index);
        if (!anchor) return false;
        const target = isShiftPressed(event) ? constrainCornerToSquare(anchor, point) : point;
        const snapped = maybeSnapPoint(target);
        const rect = normalizedRect(anchor, snapped);
        annotation.geometry.x = rect.x;
        annotation.geometry.y = rect.y;
        annotation.geometry.width = rect.width;
        annotation.geometry.height = rect.height;
        return true;
      }
      case 'angle': {
        if (!handle.key) return false;
        const snapped = maybeSnapPoint(point);
        annotation.geometry[handle.key] = { x: snapped.x, y: snapped.y };
        return true;
      }
      default:
        return false;
    }
  }

  function updateHandleMeasurement(annotation) {
    switch (annotation.type) {
      case 'line': {
        const { start, end } = annotation.geometry;
        if (start && end) {
          updateMeasurementStatus(lengthBetween(start, end), 'length');
        } else {
          updateMeasurementStatus(null);
        }
        break;
      }
      case 'polyline': {
        const points = annotation.geometry.points || [];
        updateMeasurementStatus(points.length >= 2 ? polylineLength(points) : null, 'length');
        break;
      }
      case 'polygon':
      case 'triangle': {
        const points = annotation.geometry.points || [];
        updateMeasurementStatus(points.length >= 3 ? polygonArea(points) : null, 'area');
        break;
      }
      case 'rect': {
        const { width, height } = annotation.geometry;
        if (!Number.isFinite(width) || !Number.isFinite(height)) {
          updateMeasurementStatus(null);
        } else {
          updateMeasurementStatus({ width, height }, 'rectSides');
        }
        break;
      }
      case 'ellipse': {
        const { width, height } = annotation.geometry;
        const area = Math.PI * Math.abs(width / 2) * Math.abs(height / 2);
        updateMeasurementStatus(area > 0 ? area : null, 'area');
        break;
      }
      case 'angle': {
        const { a, b, c } = annotation.geometry;
        if (a && b && c) {
          updateMeasurementStatus(angleBetween(a, b, c), 'angle');
        } else {
          updateMeasurementStatus(null);
        }
        break;
      }
      default:
        updateMeasurementStatus(null);
    }
  }

  function handleSelectUp(event) {
    if (activeHandle) {
      pushHistory('Adjust annotation handle');
      activeHandle = null;
      updateMeasurementStatus(null);
      return;
    }
    if (event.detail === 2) {
      const hit = hitTest(toCanvasCoords(event.clientX, event.clientY));
      if (hit && hit.type === 'text') {
        const newText = prompt('Edit text', hit.geometry.content);
        if (newText != null) {
          hit.geometry.content = newText;
          pushHistory('Edit text');
          scheduleRedraw();
          refreshUI();
        }
      }
    }
    pushHistory('Move annotations');
  }

  function translateAnnotation(annotation, dx, dy) {
    switch (annotation.type) {
      case 'point':
        annotation.geometry.x += dx;
        annotation.geometry.y += dy;
        break;
      case 'line':
        annotation.geometry.start.x += dx;
        annotation.geometry.start.y += dy;
        annotation.geometry.end.x += dx;
        annotation.geometry.end.y += dy;
        break;
      case 'polyline':
      case 'polygon':
      case 'triangle':
        for (const p of annotation.geometry.points) {
          p.x += dx;
          p.y += dy;
        }
        break;
      case 'rect':
      case 'ellipse':
        annotation.geometry.x += dx;
        annotation.geometry.y += dy;
        break;
      case 'angle':
        annotation.geometry.a.x += dx;
        annotation.geometry.a.y += dy;
        annotation.geometry.b.x += dx;
        annotation.geometry.b.y += dy;
        annotation.geometry.c.x += dx;
        annotation.geometry.c.y += dy;
        break;
      case 'text':
        annotation.geometry.position.x += dx;
        annotation.geometry.position.y += dy;
        break;
    }
  }

  function classifyLineAxis(annotation) {
    const { start, end } = annotation.geometry;
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    if (Math.abs(dx) >= Math.abs(dy)) {
      return dx >= 0 ? 'right' : 'left';
    }
    return 'vertical';
  }

  function extendSelectedLinesToVanishingPoints() {
    const targets = appState.selection
      .map(id => appState.annotations.find(a => a && a.id === id))
      .filter(annotation => annotation && annotation.type === 'line' && !isAnnotationLocked(annotation.id));
    if (!targets.length) {
      toast('Select one or more unlocked lines to extend');
      return;
    }

    let changed = false;
    for (const line of targets) {
      const lineLength = lengthBetween(line.geometry.start, line.geometry.end);
      if (lineLength < 0.01) continue;
      const axis = classifyLineAxis(line);
      const vp = appState.vanishingPoints?.[axis];
      if (!vp) continue;
      const startDist = lengthBetween(line.geometry.start, vp);
      const endDist = lengthBetween(line.geometry.end, vp);
      if (startDist >= endDist) {
        line.geometry.start = { ...vp };
      } else {
        line.geometry.end = { ...vp };
      }
      line.style.stroke = VANISH_COLORS[axis] || line.style.stroke;
      changed = true;
    }

    if (changed) {
      pushHistory('Extend lines to vanishing points');
      scheduleRedraw();
      refreshUI();
      updateMeasurementStatus(null);
      toast('Lines extended to vanishing points');
    } else {
      toast('Set vanishing points before extending lines');
    }
  }

  function hitTest(point) {
    for (let i = appState.annotations.length - 1; i >= 0; i--) {
      const annotation = appState.annotations[i];
      if (!isAnnotationVisible(annotation.id)) continue;
      const bounds = annotationBounds(annotation);
      if (!bounds) continue;
      if (
        point.x >= bounds.x - 6 &&
        point.x <= bounds.x + bounds.width + 6 &&
        point.y >= bounds.y - 6 &&
        point.y <= bounds.y + bounds.height + 6
      ) {
        return annotation;
      }
    }
    return null;
  }

  /* ==========================================
     Layers & Properties
     ========================================== */

  function refreshUI() {
    refreshLayers();
    refreshAnnotationsList();
    refreshProperties();
    updateUndoRedoButtons();
  }

  function findLayerById(id) {
    return appState.layers.find(layer => layer.id === id) || null;
  }

  function layerContainsAnnotation(layer, annotationId) {
    if (!layer || !layer.children) return false;
    for (const child of layer.children) {
      if (child === annotationId) return true;
      const childLayer = findLayerById(child);
      if (childLayer && layerContainsAnnotation(childLayer, annotationId)) {
        return true;
      }
    }
    return false;
  }

  function gatherAnnotationIds(layer) {
    const ids = [];
    if (!layer || !layer.children) return ids;
    for (const child of layer.children) {
      const childLayer = findLayerById(child);
      if (childLayer) {
        ids.push(...gatherAnnotationIds(childLayer));
      } else {
        ids.push(child);
      }
    }
    return ids;
  }

  function toggleAnnotationVisibility(annotation) {
    annotation.hidden = !annotation.hidden;
    if (annotation.hidden) {
      appState.selection = appState.selection.filter(id => id !== annotation.id);
    }
    scheduleRedraw();
    pushHistory('Toggle annotation visibility');
    refreshUI();
  }

  function toggleAnnotationLock(annotation) {
    annotation.locked = !annotation.locked;
    pushHistory('Toggle annotation lock');
    refreshUI();
  }

  function toggleLayerVisibility(layer) {
    layer.visible = layer.visible === false ? true : false;
    if (layer.visible === false) {
      const ids = gatherAnnotationIds(layer);
      if (ids.length) {
        appState.selection = appState.selection.filter(id => !ids.includes(id));
      }
    }
    scheduleRedraw();
    pushHistory('Toggle layer visibility');
    refreshUI();
  }

  function toggleLayerLock(layer) {
    layer.locked = !layer.locked;
    pushHistory('Toggle layer lock');
    refreshUI();
  }

  function refreshLayers() {
    const list = $('#layer-list');
    list.innerHTML = '';
    for (const layer of appState.layers) {
      list.appendChild(renderLayerTree(layer, 0));
    }
  }

  function renderLayerTree(layer, depth) {
    const item = document.createElement('li');
    item.className = 'layer-item';
    item.dataset.id = layer.id;
    if (layer.visible === false) {
      item.classList.add('hidden');
    }
    if (layer.locked) {
      item.classList.add('locked');
    }
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.style.paddingLeft = `${depth * 12}px`;

    const visBtn = document.createElement('button');
    visBtn.textContent = layer.visible === false ? '🙈' : '👁';
    visBtn.title = layer.visible === false ? 'Show layer' : 'Hide layer';
    visBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleLayerVisibility(layer);
    });
    row.appendChild(visBtn);

    const lockBtn = document.createElement('button');
    lockBtn.textContent = layer.locked ? '🔒' : '🔓';
    lockBtn.title = layer.locked ? 'Unlock layer' : 'Lock layer';
    lockBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleLayerLock(layer);
    });
    row.appendChild(lockBtn);

    const title = document.createElement('span');
    title.textContent = layer.name;
    row.appendChild(title);

    const meta = document.createElement('span');
    meta.className = 'layer-meta';
    const layerCount = gatherAnnotationIds(layer).length;
    meta.textContent = layerCount === 1 ? '1 item' : `${layerCount} items`;
    row.appendChild(meta);

    row.addEventListener('click', () => {
      const ids = gatherAnnotationIds(layer);
      if (ids.length) {
        appState.selection = ids;
        scheduleRedraw();
        refreshUI();
      }
    });

    item.appendChild(row);

    if (layer.children && layer.children.length) {
      const childList = document.createElement('ul');
      childList.className = 'layer-children';
      for (const child of layer.children) {
        const childLayer = findLayerById(child);
        if (childLayer) {
          childList.appendChild(renderLayerTree(childLayer, depth + 1));
        } else {
          const annotation = appState.annotations.find(a => a.id === child);
          if (annotation) {
            childList.appendChild(renderLayerAnnotation(annotation, depth + 1));
          }
        }
      }
      if (childList.children.length) {
        item.appendChild(childList);
      }
    }

    return item;
  }

  function renderLayerAnnotation(annotation, depth) {
    const item = document.createElement('li');
    item.className = 'layer-item layer-annotation';
    if (appState.selection.includes(annotation.id)) {
      item.classList.add('selected');
    }
    if (annotation.hidden) {
      item.classList.add('hidden');
    }
    if (annotation.locked) {
      item.classList.add('locked');
    }
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.style.paddingLeft = `${depth * 12}px`;

    const visBtn = document.createElement('button');
    visBtn.textContent = annotation.hidden ? '🙈' : '👁';
    visBtn.title = annotation.hidden ? 'Show annotation' : 'Hide annotation';
    visBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleAnnotationVisibility(annotation);
    });
    row.appendChild(visBtn);

    const lockBtn = document.createElement('button');
    lockBtn.textContent = annotation.locked ? '🔒' : '🔓';
    lockBtn.title = annotation.locked ? 'Unlock annotation' : 'Lock annotation';
    lockBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleAnnotationLock(annotation);
    });
    row.appendChild(lockBtn);

    const title = document.createElement('span');
    title.textContent = annotationDisplayName(annotation);
    row.appendChild(title);

    const measurement = measurementForAnnotation(annotation);
    if (measurement) {
      const meta = document.createElement('span');
      meta.className = 'layer-meta';
      meta.textContent = `${measurementLabel(measurement.kind)}: ${formatMeasurement(measurement.value, measurement.kind)}`;
      row.appendChild(meta);
    }

    if (annotation.type === 'triangle') {
      const triText = triangleSummary(annotation.geometry.points);
      if (triText) {
        const triMeta = document.createElement('span');
        triMeta.className = 'layer-meta';
        triMeta.textContent = triText;
        row.appendChild(triMeta);
      }
    }

    if (annotation.type === 'rect') {
      const rectText = rectangleSummary(annotation.geometry);
      if (rectText) {
        const rectMeta = document.createElement('span');
        rectMeta.className = 'layer-meta';
        rectMeta.textContent = rectText;
        row.appendChild(rectMeta);
      }
    }

    row.addEventListener('click', () => {
      appState.selection = [annotation.id];
      scheduleRedraw();
      refreshUI();
    });

    item.appendChild(row);
    return item;
  }

  function refreshAnnotationsList() {
    const list = $('#annotation-list');
    list.innerHTML = '';
    for (const annotation of appState.annotations) {
      const item = document.createElement('li');
      item.className = 'annotation-item';
      item.dataset.id = annotation.id;
      if (appState.selection.includes(annotation.id)) {
        item.classList.add('selected');
      }
      if (annotation.hidden || !isAnnotationVisible(annotation.id)) {
        item.classList.add('hidden');
      }
      const row = document.createElement('div');
      row.className = 'annotation-row';
      row.addEventListener('click', () => {
        appState.selection = [annotation.id];
        scheduleRedraw();
        refreshUI();
      });

      const name = document.createElement('span');
      name.textContent = annotationDisplayName(annotation);
      row.appendChild(name);

      const measurement = measurementForAnnotation(annotation);
      if (measurement) {
        const measurementEl = document.createElement('span');
        measurementEl.className = 'annotation-measurement';
        measurementEl.textContent = `${measurementLabel(measurement.kind)}: ${formatMeasurement(measurement.value, measurement.kind)}`;
        row.appendChild(measurementEl);
      }

      if (annotation.type === 'triangle') {
        const triText = triangleSummary(annotation.geometry.points);
        if (triText) {
          const triEl = document.createElement('span');
          triEl.className = 'annotation-coords';
          triEl.textContent = triText;
          row.appendChild(triEl);
        }
      }

      if (annotation.type === 'rect') {
        const rectText = rectangleSummary(annotation.geometry);
        if (rectText) {
          const rectEl = document.createElement('span');
          rectEl.className = 'annotation-coords';
          rectEl.textContent = rectText;
          row.appendChild(rectEl);
        }
      }

      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.title = 'Delete annotation';
      delBtn.addEventListener('click', event => {
        event.stopPropagation();
        deleteAnnotation(annotation.id);
      });
      row.appendChild(delBtn);

      item.appendChild(row);
      list.appendChild(item);
    }
  }

  function refreshProperties() {
    const panel = $('#properties-content');
    panel.innerHTML = '';
    if (appState.selection.length !== 1) {
      panel.textContent = 'Select an annotation to edit its properties.';
      return;
    }
    const annotation = appState.annotations.find(a => a.id === appState.selection[0]);
    if (!annotation) {
      panel.textContent = 'Select an annotation to edit its properties.';
      return;
    }

    panel.appendChild(makeInput('Stroke color', 'color', annotation.style.stroke || '#000000', value => {
      annotation.style.stroke = value;
      scheduleRedraw();
      scheduleAutosave();
    }));

    panel.appendChild(makeInput('Fill color', 'color', annotation.style.fill || '#000000', value => {
      annotation.style.fill = value;
      scheduleRedraw();
      scheduleAutosave();
    }));

    panel.appendChild(makeInput('Stroke width', 'number', annotation.style.strokeWidth || 2, value => {
      annotation.style.strokeWidth = Number(value);
      scheduleRedraw();
      scheduleAutosave();
    }, { min: 1, max: 20 }));

    panel.appendChild(makeInput('Opacity', 'range', annotation.style.opacity ?? 1, value => {
      annotation.style.opacity = Number(value);
      scheduleRedraw();
      scheduleAutosave();
    }, { min: 0.1, max: 1, step: 0.05 }));

    if (annotation.type === 'text') {
      panel.appendChild(makeInput('Text', 'text', annotation.geometry.content, value => {
        annotation.geometry.content = value;
        scheduleRedraw();
        scheduleAutosave();
      }));

      panel.appendChild(makeInput('Text size', 'number', annotation.style.textSize || 16, value => {
        annotation.style.textSize = Number(value);
        scheduleRedraw();
        scheduleAutosave();
      }, { min: 8, max: 72 }));
    }
  }

  function makeInput(labelText, type, value, onChange, attrs = {}) {
    const wrapper = document.createElement('div');
    const label = document.createElement('label');
    label.textContent = labelText;
    const input = document.createElement('input');
    input.type = type;
    input.value = value;
    for (const [k, v] of Object.entries(attrs)) {
      input[k] = v;
    }
    input.addEventListener('input', () => onChange(input.value));
    wrapper.appendChild(label);
    wrapper.appendChild(input);
    return wrapper;
  }

  function deleteAnnotation(id) {
    if (isAnnotationLocked(id)) {
      toast('Unlock the annotation or its layer before deleting');
      return;
    }
    const index = appState.annotations.findIndex(a => a.id === id);
    if (index === -1) return;
    appState.annotations.splice(index, 1);
    for (const layer of appState.layers) {
      const idx = layer.children.indexOf(id);
      if (idx !== -1) layer.children.splice(idx, 1);
    }
    appState.selection = [];
    pushHistory('Delete annotation');
    scheduleRedraw();
    refreshUI();
  }

  /* ==========================================
     Persistence & Export
     ========================================== */

  function exportPNG() {
    if (!appState.image) {
      toast('Load an image before exporting PNG');
      return;
    }
    const offscreen = document.createElement('canvas');
    offscreen.width = appState.image.width;
    offscreen.height = appState.image.height;
    const offCtx = offscreen.getContext('2d');
    offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
    offCtx.drawImage(appState.image, 0, 0);
    for (const annotation of appState.annotations) {
      if (!isAnnotationVisible(annotation.id)) continue;
      drawAnnotationToContext(offCtx, annotation);
    }
    offscreen.toBlob(blob => {
      if (!blob) {
        toast('Export failed');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'annotation.png';
      a.click();
      URL.revokeObjectURL(url);
      toast('PNG export complete');
    });
  }

  function drawAnnotationToContext(context, annotation) {
    context.save();
    context.globalAlpha = annotation.style.opacity ?? 1;
    context.lineWidth = annotation.style.strokeWidth || TOOL_DEFAULTS.strokeWidth;
    context.strokeStyle = annotation.style.stroke || TOOL_DEFAULTS.stroke;
    context.fillStyle = annotation.style.fill || TOOL_DEFAULTS.fill;

    switch (annotation.type) {
      case 'point':
        context.beginPath();
        context.arc(annotation.geometry.x, annotation.geometry.y, 4, 0, Math.PI * 2);
        context.fill();
        context.stroke();
        break;
      case 'line':
        context.beginPath();
        context.moveTo(annotation.geometry.start.x, annotation.geometry.start.y);
        context.lineTo(annotation.geometry.end.x, annotation.geometry.end.y);
        context.stroke();
        break;
      case 'polyline':
        context.beginPath();
        annotation.geometry.points.forEach((pt, idx) => {
          if (idx === 0) context.moveTo(pt.x, pt.y);
          else context.lineTo(pt.x, pt.y);
        });
        context.stroke();
        break;
      case 'rect':
        context.beginPath();
        context.rect(annotation.geometry.x, annotation.geometry.y, annotation.geometry.width, annotation.geometry.height);
        context.fill();
        context.stroke();
        break;
      case 'ellipse':
        context.beginPath();
        context.ellipse(
          annotation.geometry.x + annotation.geometry.width / 2,
          annotation.geometry.y + annotation.geometry.height / 2,
          Math.abs(annotation.geometry.width) / 2,
          Math.abs(annotation.geometry.height) / 2,
          0,
          0,
          Math.PI * 2
        );
        context.fill();
        context.stroke();
        break;
      case 'polygon':
        context.beginPath();
        annotation.geometry.points.forEach((pt, idx) => {
          if (idx === 0) context.moveTo(pt.x, pt.y);
          else context.lineTo(pt.x, pt.y);
        });
        context.closePath();
        context.fill();
        context.stroke();
        break;
      case 'triangle':
        context.beginPath();
        annotation.geometry.points.forEach((pt, idx) => {
          if (idx === 0) context.moveTo(pt.x, pt.y);
          else context.lineTo(pt.x, pt.y);
        });
        context.closePath();
        context.fill();
        context.stroke();
        break;
      case 'angle':
        context.beginPath();
        context.moveTo(annotation.geometry.a.x, annotation.geometry.a.y);
        context.lineTo(annotation.geometry.b.x, annotation.geometry.b.y);
        context.lineTo(annotation.geometry.c.x, annotation.geometry.c.y);
        context.stroke();
        break;
      case 'text':
        context.save();
        context.font = `${annotation.style.textSize || TOOL_DEFAULTS.textSize}px/1.2 sans-serif`;
        context.fillStyle = annotation.style.textColor || TOOL_DEFAULTS.textColor;
        context.fillText(annotation.geometry.content, annotation.geometry.position.x, annotation.geometry.position.y);
        context.restore();
        break;
    }

    context.restore();
  }

  function exportProjectJSON() {
    const payload = serializeState();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'project.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Project JSON exported');
  }

  function importProjectJSON(file) {
    file.text().then(text => {
      try {
        const payload = JSON.parse(text);
        if (!payload || payload.schemaVersion !== SCHEMA_VERSION) {
          throw new Error('Unsupported project format');
        }
        restoreSnapshot(payload);
        pushHistory('Import project');
        toast('Project loaded');
      } catch (err) {
        console.error(err);
        toast('Failed to load project');
      }
    });
  }

  function resetCanvas() {
    appState.image = null;
    appState.viewport.zoom = 1;
    appState.viewport.panX = 0;
    appState.viewport.panY = 0;
    appState.annotations = [];
    appState.layers = [{ id: 'base', name: 'Annotations', visible: true, locked: false, children: [] }];
    appState.selection = [];
    appState.draft = null;
    appState.calibration = null;
    appState.vanishingPoints = defaultVanishingPoints();
    appState.history = { stack: [], index: -1 };
    localStorage.removeItem(AUTOSAVE_KEY);
    resetModifiers();
    activeHandle = null;
    scheduleRedraw();
    refreshUI();
    updateMeasurementStatus(null);
    toast('Canvas reset');
  }

  /* ==========================================
     Image Loading
     ========================================== */

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        appState.image = img;
        appState.viewport.zoom = 1;
        appState.viewport.panX = 0;
        appState.viewport.panY = 0;
        fitImage();
        scheduleRedraw();
        pushHistory('Load image');
        toast('Image loaded');
      };
      img.src = reader.result;
    };
    reader.onerror = () => toast('Failed to read image');
    reader.readAsDataURL(file);
  }

  function fitImage() {
    if (!appState.image) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = (rect.width * appState.viewport.dpr) / appState.image.width;
    const scaleY = (rect.height * appState.viewport.dpr) / appState.image.height;
    const zoom = Math.min(scaleX, scaleY);
    appState.viewport.zoom = zoom;
    appState.viewport.panX = (canvas.width - appState.image.width * zoom) / 2;
    appState.viewport.panY = (canvas.height - appState.image.height * zoom) / 2;
    updateZoomStatus();
    scheduleRedraw();
  }

  function setViewPreset(preset) {
    if (!appState.image) {
      toast('Load an image first');
      return;
    }
    switch (preset) {
      case 'fit':
        fitImage();
        return;
      case 'fill': {
        const rect = canvas.getBoundingClientRect();
        const zoom = Math.max(
          (rect.width * appState.viewport.dpr) / appState.image.width,
          (rect.height * appState.viewport.dpr) / appState.image.height
        );
        appState.viewport.zoom = zoom;
        appState.viewport.panX = (canvas.width - appState.image.width * zoom) / 2;
        appState.viewport.panY = (canvas.height - appState.image.height * zoom) / 2;
        break;
      }
      case '100':
        appState.viewport.zoom = 1;
        appState.viewport.panX = (canvas.width - appState.image.width) / 2;
        appState.viewport.panY = (canvas.height - appState.image.height) / 2;
        break;
      case 'actual':
        appState.viewport.zoom = window.devicePixelRatio || 1;
        appState.viewport.panX = (canvas.width - appState.image.width * appState.viewport.zoom) / 2;
        appState.viewport.panY = (canvas.height - appState.image.height * appState.viewport.zoom) / 2;
        break;
    }
    appState.viewport.zoom = clamp(appState.viewport.zoom, MIN_ZOOM, MAX_ZOOM);
    updateZoomStatus();
    scheduleRedraw();
  }

  /* ==========================================
     Draft multi-stage completion
     ========================================== */

  canvas.addEventListener('dblclick', event => {
    if (!appState.draft) return;
    if (PATH_TOOLS.has(appState.draft.type)) {
      finishDrawing();
    }
  });

  canvas.addEventListener('click', handleAngleClick);

  /* ==========================================
     Tabs & UI
     ========================================== */

  function setupTabs() {
    const buttons = $$('aside .tabs button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-selected', b === btn);
        });
        $$('.panel').forEach(panel => {
          panel.classList.toggle('active', panel.id === `${btn.dataset.tab}-panel`);
        });
      });
    });
  }

  /* ==========================================
     Event Wiring
     ========================================== */

  function handleKeyDown(event) {
    applyModifier(event, true);
    if (event.target && ['INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
    if (event.key === 'z' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      if (event.shiftKey) {
        redo();
      } else {
        undo();
      }
      return;
    }
    if (event.key >= '0' && event.key <= '9') {
      const index = event.key === '0' ? 9 : Number(event.key) - 1;
      const tool = TOOL_ORDER[index];
      if (tool) setTool(tool);
      return;
    }
    if (event.key.toLowerCase() === 'c') {
      setTool('calibrate');
      return;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      if (appState.selection.length) {
        for (const id of [...appState.selection]) {
          deleteAnnotation(id);
        }
      }
    }
  }

  function handleKeyUp(event) {
    applyModifier(event, false);
  }

  function setupEvents() {
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    canvas.addEventListener('pointerdown', beginPointer);
    canvas.addEventListener('pointermove', movePointer);
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', cancelPointer);
    canvas.addEventListener('wheel', handleWheel, { passive: false });

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    window.addEventListener('blur', resetModifiers);

    $('#undo-btn').addEventListener('click', undo);
    $('#redo-btn').addEventListener('click', redo);

    $('#tool-palette').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.action) {
        handleToolAction(button.dataset.action);
        return;
      }
      if (button.dataset.tool) {
        setTool(button.dataset.tool);
      }
    });

    $('#snap-toggle').addEventListener('change', event => {
      appState.settings.snapEnabled = event.target.checked;
      scheduleAutosave();
    });

    setupMenus();
    setupTabs();
    setupDragAndDrop();
  }

  function setupMenus() {
    $$('header .menu').forEach(menu => {
      const trigger = menu.querySelector('.menu-trigger');
      trigger.addEventListener('click', () => {
        const expanded = menu.getAttribute('aria-expanded') === 'true';
        closeMenus();
        menu.setAttribute('aria-expanded', (!expanded).toString());
      });
      menu.querySelectorAll('.menu-content button').forEach(btn => {
        btn.addEventListener('click', () => {
          handleMenuAction(btn);
          closeMenus();
        });
      });
    });

    document.addEventListener('click', event => {
      if (!event.target.closest('.menu')) {
        closeMenus();
      }
    });
  }

  function closeMenus() {
    $$('header .menu').forEach(menu => menu.setAttribute('aria-expanded', 'false'));
  }

  function handleMenuAction(button) {
    const action = button.dataset.action;
    const viewPreset = button.dataset.view;
    const axis = button.dataset.axis;
    switch (action) {
      case 'open-image':
        $('#hidden-image-input').click();
        break;
      case 'save-project':
        exportProjectJSON();
        break;
      case 'load-project':
        $('#hidden-project-input').click();
        break;
      case 'export-png':
        exportPNG();
        break;
      case 'reset':
        resetCanvas();
        break;
      case 'set-vanishing':
        if (axis) {
          promptVanishingPoint(axis);
        }
        break;
      default:
        if (viewPreset) {
          setViewPreset(viewPreset);
        }
    }
  }

  function handleToolAction(action) {
    switch (action) {
      case 'extend-vp':
        extendSelectedLinesToVanishingPoints();
        break;
    }
  }

  function promptVanishingPoint(axis) {
    const labels = { left: 'Left', right: 'Right', vertical: 'Vertical' };
    const current = appState.vanishingPoints?.[axis] || { x: 0, y: 0 };
    const fallback = `${formatNumber(current.x, 1)}, ${formatNumber(current.y, 1)}`;
    const input = prompt(`Enter ${labels[axis] || axis} vanishing point as "x,y"`, fallback);
    if (input == null) return;
    const parts = input.split(',').map(part => part.trim());
    if (parts.length !== 2) {
      toast('Enter coordinates as "x,y"');
      return;
    }
    const x = Number(parts[0]);
    const y = Number(parts[1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      toast('Invalid coordinates');
      return;
    }
    appState.vanishingPoints[axis] = { x, y };
    scheduleRedraw();
    scheduleAutosave();
    toast(`${labels[axis] || axis} vanishing point updated`);
  }

  function setupDragAndDrop() {
    ['dragenter', 'dragover'].forEach(evt => {
      canvas.addEventListener(evt, event => {
        event.preventDefault();
      });
    });
    canvas.addEventListener('drop', event => {
      event.preventDefault();
      const file = Array.from(event.dataTransfer.files).find(f => f.type.startsWith('image/'));
      if (file) loadImage(file);
    });

    $('#hidden-image-input').addEventListener('change', event => {
      const file = event.target.files?.[0];
      if (file) loadImage(file);
      event.target.value = '';
    });

    $('#hidden-project-input').addEventListener('change', event => {
      const file = event.target.files?.[0];
      if (file) importProjectJSON(file);
      event.target.value = '';
    });
  }

  /* ==========================================
     Autosave recovery
     ========================================== */

  function recoverAutosave() {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if (!saved) return;
    try {
      const payload = JSON.parse(saved);
      if (payload && payload.schemaVersion === SCHEMA_VERSION) {
        restoreSnapshot(payload);
        toast('Session restored from autosave');
      }
    } catch (err) {
      console.error('Autosave recovery failed', err);
    }
  }

  /* ==========================================
     Boot
     ========================================== */

  function boot() {
    setupEvents();
    recoverAutosave();
    refreshUI();
    updateZoomStatus();
    updateMeasurementStatus(null);
    scheduleRedraw();
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
